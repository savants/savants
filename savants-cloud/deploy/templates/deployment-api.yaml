apiVersion: apps/v1
kind: Deployment
metadata:
  name: savants-cloud-api
  labels:
    app: savants-cloud
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: savants-cloud
      component: api
  template:
    metadata:
      labels:
        app: savants-cloud
        component: api
    spec:
      containers:
        - name: api
          image: {{ .Values.api.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: savants-cloud-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://{{ .Values.falkordb.host }}:{{ .Values.falkordb.port }}"
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: savants-cloud-secrets
                  key: jwt-secret
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: savants-cloud-secrets
                  key: stripe-secret-key
                  optional: true
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: savants-cloud-secrets
                  key: stripe-webhook-secret
                  optional: true
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
