apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: savants-cloud-postgres
spec:
  serviceName: savants-cloud-postgres
  replicas: 1
  selector:
    matchLabels:
      app: savants-cloud
      component: postgres
  template:
    metadata:
      labels:
        app: savants-cloud
        component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: savants-cloud-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: savants-cloud-postgres
spec:
  selector:
    app: savants-cloud
    component: postgres
  ports:
    - port: 5432
