[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "savants"
version = "0.1.0"
description = "Structural code intelligence for AI agents and PR review"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "falkordb>=1.0.0",
    "temporalio>=1.7.0",
    "pydantic>=2.0",
    "pydantic-ai>=0.1.0",
    "graphiti-core>=0.1.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "click>=8.1.0",
    "kubernetes>=32.0.0",
    "drain3>=0.9.11",
]

[project.scripts]
savants = "savants.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
savants = [
    "binaries/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring live FalkorDB",
]
