[package]
name = "savants-ebpf"
version = "0.1.0"
edition = "2021"
description = "Savants kernel-level security probe — eBPF runtime telemetry"

[[bin]]
name = "savants-ebpf"
path = "src/main.rs"

[dependencies]
aya = "0.12"
aya-log = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
redis = "0.25"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.27", features = ["user", "process"] }
dirs = "5"

[profile.release]
strip = "symbols"
panic = "abort"
lto = true
