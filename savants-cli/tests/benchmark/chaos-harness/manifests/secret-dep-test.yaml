apiVersion: v1
kind: Secret
metadata:
  name: app-credentials
  namespace: chaos-test
stringData:
  username: "admin"
  password: "secret123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-dep
  namespace: chaos-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secret-dep
  template:
    metadata:
      labels:
        app: secret-dep
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "cat /etc/credentials/password && echo 'Credentials loaded' && sleep 3600"]
          volumeMounts:
            - name: creds
              mountPath: /etc/credentials
              readOnly: true
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
      volumes:
        - name: creds
          secret:
            secretName: app-credentials
