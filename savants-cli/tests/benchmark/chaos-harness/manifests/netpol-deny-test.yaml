apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-server
  namespace: chaos-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpol-server
  template:
    metadata:
      labels:
        app: netpol-server
    spec:
      containers:
        - name: server
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: netpol-server
  namespace: chaos-test
spec:
  selector:
    app: netpol-server
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-client
  namespace: chaos-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpol-client
  template:
    metadata:
      labels:
        app: netpol-client
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -T 5 -O - http://netpol-server/ || echo 'CONNECTION FAILED'; sleep 5; done"]
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: chaos-test
spec:
  podSelector:
    matchLabels:
      app: netpol-server
  policyTypes:
    - Ingress
