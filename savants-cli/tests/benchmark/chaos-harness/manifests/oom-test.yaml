apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-test
  namespace: chaos-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-test
  template:
    metadata:
      labels:
        app: oom-test
    spec:
      containers:
        - name: oom-test
          image: python:3.11-slim
          command: ["python3", "-c", "import os; data = bytearray(128 * 1024 * 1024); import time; time.sleep(3600)"]
          resources:
            limits:
              memory: "10Mi"
            requests:
              memory: "10Mi"
