apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-mismatch
  namespace: chaos-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-mismatch
  template:
    metadata:
      labels:
        app: port-mismatch
    spec:
      containers:
        - name: app
          image: python:3.11-slim
          command: ["python3", "-c", "from http.server import HTTPServer, SimpleHTTPRequestHandler; HTTPServer(('0.0.0.0', 3000), SimpleHTTPRequestHandler).serve_forever()"]
          ports:
            - containerPort: 3000
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: port-mismatch
  namespace: chaos-test
spec:
  selector:
    app: port-mismatch
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: port-mismatch-client
  namespace: chaos-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: port-mismatch-client
  template:
    metadata:
      labels:
        app: port-mismatch-client
    spec:
      containers:
        - name: client
          image: busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -T 5 -O - http://port-mismatch/ 2>&1 || echo 'CONNECTION REFUSED to port-mismatch service'; sleep 5; done"]
          resources:
            limits:
              memory: "32Mi"
              cpu: "50m"
