[package]
name = "savants-core"
version = "0.1.0"
edition = "2021"
description = "Native Rust core for SynapCode: tree-sitter CPG builder + delta computer"
license = "Proprietary"

[lib]
name = "savants_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Tree-sitter and its language grammars (native, ~5-10x faster than Python bindings)
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# Serialization for Delta protocol wire format
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config file formats (YAML / TOML) for the config indexing pass
serde_yaml = "0.9"
toml = "0.8"

# Hashing for content fingerprints
sha2 = "0.10"
hex = "0.4"

# Walking directories
walkdir = "2"

# Optional Python bindings — feature-gated so we can ship a pure Rust crate too
[dependencies.pyo3]
version = "0.22"
features = ["extension-module"]
optional = true

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
