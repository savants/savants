name: Release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: savants
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            binary: savants
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: savants
          - target: aarch64-apple-darwin
            os: macos-14
            binary: savants

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compile deps (aarch64 Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> savants-cli/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> savants-cli/.cargo/config.toml

      - name: Build
        working-directory: savants-cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp savants-cli/target/${{ matrix.target }}/release/${{ matrix.binary }} dist/savants-${{ matrix.target }}
          chmod +x dist/savants-${{ matrix.target }}
          cd dist && tar czf savants-${{ matrix.target }}.tar.gz savants-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: savants-${{ matrix.target }}
          path: dist/savants-${{ matrix.target }}.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/savants-*.tar.gz
          generate_release_notes: true
