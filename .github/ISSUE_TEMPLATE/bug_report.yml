name: Bug Report
description: Report a bug in savants-guard or the CLI
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python SDK (savants-guard)
        - CLI (savants guard)
        - Guard profiles
        - Cloud dashboard
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.4.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pip install savants-guard
        2. ...
    validations:
      required: true
