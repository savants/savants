name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Python SDK (savants-guard)
        - CLI (savants guard)
        - Guard profiles
        - DSL (new operator or action)
        - Cloud dashboard
        - Framework integration
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      placeholder: Why do you need this? What problem does it solve?
    validations:
      required: true
