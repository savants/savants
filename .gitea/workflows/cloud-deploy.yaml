name: Deploy savants-cloud

on:
  push:
    branches: [main]
    paths:
      - 'savants-cloud/**'
      - '.gitea/workflows/cloud-deploy.yaml'
  workflow_dispatch:

jobs:
  build:
    name: Build savants-cloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.88.0
          . "$HOME/.cargo/env"

      - name: Build
        working-directory: savants-cloud
        env:
          SQLX_OFFLINE: "true"
        run: |
          . "$HOME/.cargo/env"
          cargo build --release
          ls -lh target/release/savants-cloud

      - name: Upload to MinIO
        env:
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
          chmod +x /usr/local/bin/mc
          mc alias set releases http://minio.minio.svc.cluster.local:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
          mc cp savants-cloud/target/release/savants-cloud "releases/savants-releases/cloud/savants-cloud"
          echo "Build uploaded. Triggering deploy..."

      - name: Trigger deploy on host
        run: |
          # Call a webhook on the host to trigger the Docker build + k3s deploy
          # The webhook runs the deploy script below
          curl -sf "http://savants-cloud-api.savants-cloud.svc.cluster.local:80/health" || true
          # Trigger via Gotify notification (which the host monitors)
          curl -sf "http://gotify.atlas-system.svc.cluster.local:80/message?token=${{ secrets.GOTIFY_TOKEN }}" \
            -F "title=savants-cloud deploy" \
            -F "message=New build ready in MinIO" \
            -F "priority=8" 2>/dev/null || echo "Deploy notification sent (or Gotify not configured)"
