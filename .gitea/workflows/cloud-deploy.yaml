name: Deploy savants-cloud

on:
  push:
    branches: [main]
    paths:
      - 'savants-cloud/**'
      - '.gitea/workflows/cloud-deploy.yaml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and deploy savants-cloud
    runs-on: ubuntu-latest
    container:
      image: docker:27-dind
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - /usr/local/bin/k3s:/usr/local/bin/k3s
        - /etc/rancher/k3s/k3s.yaml:/etc/rancher/k3s/k3s.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          apk add --no-cache curl bash
          # Install kubectl
          curl -sLO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && mv kubectl /usr/local/bin/
          # Install helm
          curl -fsSL https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz | tar xz
          mv linux-amd64/helm /usr/local/bin/
          # Configure kubectl for k3s
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl get nodes

      - name: Build Docker image
        working-directory: savants-cloud
        run: docker build -t savants/savants-cloud:latest .

      - name: Import to k3s
        run: |
          docker save savants/savants-cloud:latest | k3s ctr images import -
          echo "Image imported"

      - name: Deploy
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          helm upgrade --install savants-cloud savants-cloud/deploy/ \
            --namespace savants-cloud \
            --set api.image=savants/savants-cloud:latest \
            --wait --timeout 5m
          # Force new pod to pick up latest image
          kubectl rollout restart deployment/savants-cloud-api -n savants-cloud
          kubectl rollout status deployment/savants-cloud-api -n savants-cloud --timeout=60s

      - name: Verify
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          kubectl get pods -n savants-cloud
          echo "---"
          sleep 5
          curl -sf https://api.savants.cloud/health && echo " - healthy" || echo "waiting for rollout"
