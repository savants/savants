name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            zigbuild: false
            cross: false
          - target: aarch64-unknown-linux-gnu
            zigbuild: false
            cross: true
          - target: x86_64-apple-darwin
            zigbuild: true
            cross: false
          - target: aarch64-apple-darwin
            zigbuild: true
            cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.82.0
          . "$HOME/.cargo/env"
          rustup target add ${{ matrix.target }}

      - name: Install cross-compile deps (aarch64 Linux)
        if: matrix.cross
        run: |
          apt-get update && apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p savants-cli/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> savants-cli/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> savants-cli/.cargo/config.toml

      - name: Install zigbuild + macOS SDK (macOS cross-compile)
        if: matrix.zigbuild
        run: |
          . "$HOME/.cargo/env"
          apt-get update && apt-get install -y python3-pip xz-utils
          pip3 install ziglang --break-system-packages
          cargo install cargo-zigbuild
          mkdir -p /opt/macos-sdk
          curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz \
            | tar xJ -C /opt/macos-sdk --strip-components=1

      - name: Build (native/cross-linux)
        if: '!matrix.zigbuild'
        working-directory: savants-cli
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --target ${{ matrix.target }}

      - name: Build (macOS via zigbuild)
        if: matrix.zigbuild
        working-directory: savants-cli
        env:
          SDKROOT: /opt/macos-sdk
        run: |
          . "$HOME/.cargo/env"
          cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          FILENAME="savants-${{ matrix.target }}"
          cp "savants-cli/target/${{ matrix.target }}/release/savants" "dist/${FILENAME}"
          chmod +x "dist/${FILENAME}"
          cd dist && tar czf "${FILENAME}.tar.gz" "${FILENAME}"

      - name: Upload to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-latest}"
          FILENAME="savants-${{ matrix.target }}.tar.gz"
          R2_API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/savants-releases/objects"

          # Upload to versioned path
          curl -sf -X PUT "${R2_API}/${TAG}/${FILENAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@dist/${FILENAME}"
          echo "Uploaded ${FILENAME} to ${TAG}/"

          # Upload to latest/
          curl -sf -X PUT "${R2_API}/latest/${FILENAME}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@dist/${FILENAME}"
          echo "Uploaded ${FILENAME} to latest/"

      - name: Create Gitea release and attach binary
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="miguel/savants"
          API="http://gitea-http.gitea.svc.cluster.local:3000/api/v1"
          FILENAME="savants-${{ matrix.target }}.tar.gz"

          RELEASE_ID=$(curl -s -H "Authorization: token ${GITEA_TOKEN}" \
            "${API}/repos/${REPO}/releases/tags/${TAG}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id',''))" 2>/dev/null)

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            RELEASE_ID=$(curl -s -X POST \
              -H "Authorization: token ${GITEA_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"name\":\"Savants ${TAG}\",\"body\":\"Install:\n\`\`\`\ncurl -fsSL savants.sh | sh\n\`\`\`\",\"draft\":false,\"prerelease\":false}" \
              "${API}/repos/${REPO}/releases" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "Created release ${TAG} (id: ${RELEASE_ID})"
          else
            echo "Release ${TAG} already exists (id: ${RELEASE_ID})"
          fi

          curl -s -X POST \
            -H "Authorization: token ${GITEA_TOKEN}" \
            -F "attachment=@dist/${FILENAME}" \
            "${API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${FILENAME}"
          echo "Attached ${FILENAME} to release ${TAG}"

  publish-metadata:
    name: Update version + install script
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Upload version.txt and install.sh to R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-v0.0.0}"
          VERSION="${TAG#v}"
          R2_API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/savants-releases/objects"

          # Update latest/version.txt
          echo -n "${VERSION}" | curl -sf -X PUT "${R2_API}/latest/version.txt" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary "@-"
          echo "Updated version.txt to ${VERSION}"

          # Upload install.sh
          curl -sf -X PUT "${R2_API}/install.sh" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data-binary @scripts/install.sh
          echo "Updated install.sh"
